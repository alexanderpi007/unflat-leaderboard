<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      font-family: 'Inter', sans-serif;
      background: #00041b;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Subtle radial glow */
    .bg-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 85% 30%, rgba(129,140,248,0.10) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Grid pattern overlay */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      height: 100%;
      padding: 48px 56px;
      gap: 48px;
    }

    /* Left column */
    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo svg {
      height: 28px;
      width: auto;
      fill: #fff;
    }

    .headline {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #f5f6ff;
    }

    .headline .accent {
      background: linear-gradient(135deg, #818cf8, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subheadline {
      font-size: 20px;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      line-height: 1.5;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 8px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .social-proof {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
    }

    .social-proof span {
      color: rgba(255,255,255,0.7);
      font-weight: 600;
    }

    /* Right column */
    .right {
      width: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    /* APY badge */
    .apy-badge {
      align-self: flex-end;
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 12px 24px;
      background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(129,140,248,0.15));
      border: 1px solid rgba(99,102,241,0.4);
      border-radius: 12px;
    }

    .apy-badge .value {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .apy-badge .label {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Leaderboard card */
    .leaderboard-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .card-live {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #34d399;
    }

    .card-live .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
    }

    .row {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .row:last-child { border-bottom: none; }

    .rank {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .rank-1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
    .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; }
    .rank-3 { background: linear-gradient(135deg, #b45309, #92400e); color: #fff; }

    .user-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-name {
      font-size: 15px;
      font-weight: 600;
      color: #f5f6ff;
    }

    .user-refs {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }

    .user-apy {
      font-size: 15px;
      font-weight: 700;
      color: #34d399;
      text-align: right;
      flex-shrink: 0;
    }

    .user-apy-label {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.35);
      text-align: right;
    }

    .apy-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }

    /* Bottom border accent */
    .bottom-accent {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #6366f1, #818cf8, #6366f1);
    }
  </style>
</head>

      <div class="subheadline">
